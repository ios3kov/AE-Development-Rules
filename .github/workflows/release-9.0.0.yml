name: Publish standard 9.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-9.0.0.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-standard-9.0.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ios3kov/AE-Development-Rules' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish after exact main CI passes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, urllib.parse
          repo = "ios3kov/AE-Development-Rules"
          target = os.environ["GITHUB_SHA"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          tag = "v9.0.0"
          ci_name = "Starter Kit Self Test"
          base = "https://api.github.com/repos/" + repo
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def api(path, data=None):
              req = urllib.request.Request(
                  base + path,
                  headers=headers,
                  data=None if data is None else json.dumps(data).encode(),
                  method="GET" if data is None else "POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and data is None:
                      return None
                  raise RuntimeError("GitHub API failed with HTTP " + str(error.code)) from None

          ci = None
          for _ in range(90):
              runs = api("/actions/runs?" + urllib.parse.urlencode({"head_sha": target, "event": "push", "per_page": 100}))
              matches = [r for r in runs.get("workflow_runs", []) if r.get("name") == ci_name and r.get("id") != current_run]
              if matches:
                  ci = max(matches, key=lambda r: r["id"])
                  if ci["status"] == "completed":
                      if ci["conclusion"] != "success":
                          raise RuntimeError("Exact main CI did not pass: " + str(ci["conclusion"]))
                      break
              time.sleep(10)
          else:
              raise RuntimeError("Timed out waiting for exact main CI")
          if not ci or ci["status"] != "completed" or ci["conclusion"] != "success":
              raise RuntimeError("Exact main CI is not successful")

          ref = api("/git/ref/tags/" + tag)
          if ref:
              obj = ref["object"]
              if obj["type"] == "tag":
                  annotated = api("/git/tags/" + obj["sha"])
                  if not annotated or annotated["object"]["type"] != "commit" or annotated["object"]["sha"] != target:
                      raise RuntimeError("Existing annotated tag points elsewhere")
              elif obj["type"] != "commit" or obj["sha"] != target:
                  raise RuntimeError("Existing tag points elsewhere")
          else:
              annotated = api("/git/tags", {
                  "tag": tag,
                  "message": "AE Development Rules 9.0.0",
                  "object": target,
                  "type": "commit",
              })
              api("/git/refs", {"ref": "refs/tags/" + tag, "sha": annotated["sha"]})

          existing = api("/releases/tags/" + tag)
          if existing:
              if existing.get("draft") or existing.get("prerelease"):
                  raise RuntimeError("Existing release is not published stable")
              print(existing["html_url"])
          else:
              body = f"""Major process release: Decision Grill for material dependent product/UX/scope decisions.

Changes:
- design tree + frontier rounds for dependent decisions;
- recommendation with every material user question;
- agent-owned fact finding from code, repository state, tools and primary sources;
- conditional decision-grill routing overlay;
- covered bugfixes and clear small changes remain interview-free;
- Smart Entry, Product Discovery, Workflow, registry and behavior cases updated.

Migration / adoption: docs/releases/9.0.0.md

Verification: exact merged main commit passed the Starter Kit Self Test on Ubuntu, macOS and Windows.
CI: {ci["html_url"]}

Exact release commit: {target}
Existing adopted project baselines remain frozen until explicit adoption. Structural/tooling CI does not certify a particular AI configuration or AE product runtime."""
              release = api("/releases", {
                  "tag_name": tag,
                  "name": "AE Development Rules 9.0.0",
                  "body": body,
                  "draft": False,
                  "prerelease": False,
                  "make_latest": "true",
              })
              print(release["html_url"])

          final_ref = api("/git/ref/tags/" + tag)
          if not final_ref:
              raise RuntimeError("Published tag missing")
          print("released", tag, target)
          PY
