name: Prepare final 11.1.0 metadata
on:
  push:
    branches: [release/11.1.0-final]
    paths: ['.github/workflows/prepare-11.1.0.yml']
permissions:
  contents: read
concurrency:
  group: prepare-standard-11.1.0
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'ios3kov/AE-Development-Rules' && github.ref == 'refs/heads/release/11.1.0-final'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare only the authorized branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          BASE = '414998a05784f97b63e90bb78635ea02b3162a4e'
          REPO = 'ios3kov/AE-Development-Rules'
          BRANCH = 'release/11.1.0-final'
          PREP = '.github/workflows/prepare-11.1.0.yml'
          PUBLISHER = '.github/workflows/release-11.1.0.yml'
          TARGET = os.environ['GITHUB_SHA']

          def require(value, message):
              if not value:
                  raise RuntimeError(message)

          def git(*args):
              return subprocess.check_output(['git', *args]).decode('utf-8')

          def api(path, data=None, method=None):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + path, headers=headers, data=None if data is None else json.dumps(data).encode(), method=method or ('GET' if data is None else 'POST'))
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def source(name):
              return git('show', BASE + ':' + name)

          def replace_once(text, old, new):
              require(text.count(old) == 1, 'Replacement is not unique: ' + old[:80])
              return text.replace(old, new, 1)

          require(os.environ['GITHUB_REPOSITORY'] == REPO and os.environ['GITHUB_REF'] == 'refs/heads/' + BRANCH, 'Wrong repository or branch')
          require(git('rev-parse', 'HEAD').strip() == TARGET, 'Checkout mismatch')
          require(git('rev-parse', 'HEAD^').strip() == BASE, 'Unexpected preparation parent')
          require(set(git('diff', '--name-only', BASE, TARGET).splitlines()) == {PREP, PUBLISHER}, 'Unexpected initial changes')
          require(api('/branches/main')['commit']['sha'] == BASE, 'Main changed; stop for review')
          require(api('/git/ref/heads/' + BRANCH)['object']['sha'] == TARGET, 'Preparation branch moved')
          require(source('VERSION') == '11.0.1\n', 'Unexpected baseline version')
          old_publisher = source('.github/workflows/release-11.0.1.yml')
          require(Path(PUBLISHER).read_text() == old_publisher.replace('11.0.1', '11.1.0'), 'Publisher must preserve all previous gates')

          notes = '''# 11.1.0 — finalized working baseline

          Выпуск от 2026-10-09 завершает согласованные исправления после v11.0.1. Исходная точка подготовки — `414998a05784f97b63e90bb78635ea02b3162a4e`, с исправлениями [PR #32](https://github.com/ios3kov/AE-Development-Rules/pull/32). Публикацию и точный итоговый commit подтверждают [GitHub Release v11.1.0](https://github.com/ios3kov/AE-Development-Rules/releases/tag/v11.1.0), annotated tag и приложенное `release-evidence.json`.

          ## Что завершено

          - `preflight` не сообщает PASS без команды проверки проекта: отсутствие проверок возвращает BLOCKED / exit 2; ошибки реально запущенных проверок сохраняются.
          - Явный `--docs-only` / `-DocsOnly` отделяет документационную правку от проверки кода. Проверяются staged, unstaged, untracked изменения и, при указанной базе, committed scope; код, конфигурация и special/executable paths не получают этот shortcut.
          - Проверка Markdown учитывает поддерживаемые ссылки на разделы, Unicode, повторяющиеся заголовки и explicit anchors. Устаревшие переходы сохранены у актуальных canonical разделов, без дублирования требований.
          - [AGENTS.md](../../AGENTS.md) ведёт к единому входу. [Рабочий маршрут](../../guides/PROJECT_EXECUTION.md) объясняет поиск существующих команд и разрешённых возможностей, а [UX-приёмка](../../guides/UX_ACCEPTANCE.md) — ранний прототип и наблюдаемые критерии качества.
          - Сохранены действующие требования native/JSX/CEP/UXP/helper, MFR/SmartFX/alpha/HDR, безопасность, точная identity и реальная AE-приёмка. Новых универсальных анкет, обязательного второго агента или полного аудита на каждую правку нет.

          ## Совместимость и внедрение

          Minor по [Engineering §34](../../core/ENGINEERING.md#34-версия-стандарта-и-фиксация-baseline): новые необязательные возможности и исправление исполнения существующих требований. Обязательный смысл, applicability, Rule/Requirement IDs и форматы project records не изменены. Ранее соответствующий 11.0.1 проект не получает нового процесса; принятые baselines обновляются только осознанно.

          При обновлении tooling учесть изменение exit semantics: старый пустой preflight мог завершаться успешно; новый требует реальную команду проверки. Настроить непустой `package.json` script `check` или подходящий `scripts/project-preflight.*`. Копировать wrapper вместе с `scripts/lib/preflight-docs.mjs` и остальными зависимостями выбранных инструментов. Успешный `echo` не подтверждает приёмку: scope проверок оценивается по существующему ядру.

          Для документации использовать `preflight.sh --docs-only` либо `preflight.ps1 -DocsOnly`. В PR/CI задать `AE_PREFLIGHT_BASE_REF` равным реальной базе сравнения. Без него уже закоммиченные изменения не входят в docs-only scope. Результат этого режима не проверяет содержание документации, код или AE.

          ## Граница выпуска и практическая оценка

          Пользователь явно поручил финализировать и опубликовать правила; практическую проверку разных ИИ он проводит самостоятельно. Реальный multi-model pilot не является prerequisite этого выпуска и не добавляется к обычному plugin workflow. [План пилота](../../packages/agent-evaluation/PILOT.md) остаётся необязательным материалом.

          Финализация означает завершённый версионированный baseline, а не обещание безошибочной работы любого ИИ. Реальный pilot и AE runtime для этого source-standard release — NOT RUN; ускорение, универсальная надёжность и переносимость отдельных project runners не объявляются доказанными. Существующие AE runtime gates самих продуктов не отменены.

          ## Проверки и материалы

          Перед публикацией должны пройти все четыре обязательных CI jobs на точном merged commit: Linux, macOS, Windows self-test и Reference Obligation Validator. Новый publisher сохраняет gates 11.0.1 и получает те же четыре отрицательных regression tests. Источники, test skips и ограничения не заменяются выдуманными результатами.

          Приложены `AE-Development-Rules-11.1.0.zip`, `AE-Development-Rules-11.1.0.tar.gz`, `SHA256SUMS.txt` и `release-evidence.json` после успешной публикации. Publisher сверяет bytes и file modes обоих архивов с Git tree, проверяет uploaded digests и tag/main identity и только затем открывает stable Release. Старые tags/releases не меняются.

          ## Начало работы

          Сохранить полный checkout/архив, проверить контрольные суммы и зафиксировать version + exact release commit в проекте. Передать ИИ задачу и [AI_ENTRYPOINT.md](../../AI_ENTRYPOINT.md); читать ядро, профиль инструмента и только применимые разделы. Практические команды и перенос проверок описаны в [starter kit](../../starter-kit/README.md) и [рабочем маршруте](../../guides/PROJECT_EXECUTION.md).
          '''
          changes = {'VERSION': '11.1.0\n', 'docs/releases/11.1.0.md': notes}
          readme = source('README.md')
          readme = replace_once(readme, '**Версия текущего checkout: v11.0.1 — 2026-10-09.**', '**Версия текущего checkout: v11.1.0 — 2026-10-09.**\n\n11.1.0 — финализированный рабочий baseline: исправленные preflight и ссылки на разделы, понятный маршрут выполнения и ранняя UX-приёмка. Обязательные требования AE сохранены; [состав выпуска, внедрение и границы](docs/releases/11.1.0.md). Практическое сравнение ИИ пользователь проводит самостоятельно; оно не блокирует выпуск стандарта и не становится обязательным этапом разработки плагина.')
          readme = replace_once(readme, 'Статус публикации и точный коммит проверяются по [GitHub Release v11.0.1](https://github.com/ios3kov/AE-Development-Rules/releases/tag/v11.0.1), его тегу и приложенному release-evidence.json. Предыдущий выпуск — [v11.0.0](https://github.com/ios3kov/AE-Development-Rules/releases/tag/v11.0.0); [его внедрение и совместимость](docs/releases/11.0.0.md).', 'Статус публикации и точный коммит проверяются по [GitHub Release v11.1.0](https://github.com/ios3kov/AE-Development-Rules/releases/tag/v11.1.0), его тегу и приложенному release-evidence.json. Предыдущий выпуск — [v11.0.1](https://github.com/ios3kov/AE-Development-Rules/releases/tag/v11.0.1); [его внедрение и совместимость](docs/releases/11.0.1.md).')
          readme = replace_once(readme, '- [VERSION](VERSION)\n', '- [VERSION](VERSION)\n- [Начало работы и переход на 11.1.0](docs/releases/11.1.0.md)\n')
          changes['README.md'] = readme
          changelog = source('CHANGELOG.md')
          entry = '''## 11.1.0 — 2026-10-09

          Finalized working baseline after the v11.0.1 audit. Minor: optional tooling/guides and enforcement corrections; no new mandatory AE/project contract, applicability change or record-schema migration. [Adoption, verification and limits](docs/releases/11.1.0.md). Publication and exact source are established by the annotated tag, GitHub Release and attached Evidence.

          - Include PR #32: empty preflight becomes BLOCKED/exit 2; explicit docs-only scope; Markdown destination/fragment checks and preserved compatibility anchors; Windows path normalization.
          - Retain the short canonical core and add navigable command-discovery/UX guidance without a second rulebook.
          - Practical AI evaluation is owner-run and outside this release gate. The optional pilot remains NOT_RUN; no model effectiveness or AE-host result is inferred from CI.
          - Reuse the exact-source CI/archive/digest publisher and extend its existing negative regressions to 11.1.0. Old releases and adopted baselines remain unchanged.

          '''
          changes['CHANGELOG.md'] = replace_once(changelog, '# Changelog\n\n', '# Changelog\n\n' + entry)
          starter = source('starter-kit/README.md')
          starter = replace_once(starter, '- local Markdown links и обязательные paths/modules;', '- local Markdown paths и поддерживаемые section anchors, обязательные paths/modules;')
          starter = replace_once(starter, '- уникальность глобальных §§1–41;', '- уникальность глобальных §§1–43;')
          starter = replace_once(starter, '## Внедрение\n', '## Внедрение\n\nДля 11.1.0: [миграция preflight и начало работы](../docs/releases/11.1.0.md), [команды проекта и проверка возможностей](../guides/PROJECT_EXECUTION.md). При переносе новых preflight wrappers сохранить `scripts/lib/preflight-docs.mjs`. Без реальной команды проверки обычный preflight возвращает BLOCKED/exit 2; docs-only выбирается явно и не подтверждает код/AE. Полный multi-model pilot не является prerequisite внедрения или выпуска стандарта.\n')
          changes['starter-kit/README.md'] = starter
          tests = source('starter-kit/tests/test_standard_release.py')
          changes['starter-kit/tests/test_standard_release.py'] = replace_once(tests, "if __name__ == '__main__':", "class FinalizedBaselineReleaseTests(StandardReleaseTests):\n    workflow_name = 'release-11.1.0.yml'\n\n\nif __name__ == '__main__':")
          for name, content in changes.items():
              Path(name).parent.mkdir(parents=True, exist_ok=True)
              Path(name).write_text(content, encoding='utf-8', newline='\n')
          ast.parse(changes['starter-kit/tests/test_standard_release.py'])
          body = Path(PUBLISHER).read_text().split("          python3 - <<'PY'\n", 1)[1].rsplit('          PY', 1)[0]
          ast.parse('\n'.join(line[10:] for line in body.splitlines()))
          check_env = {key: value for key, value in os.environ.items() if key not in {'GH_TOKEN', 'GITHUB_TOKEN'}}
          subprocess.run(['python3', '-m', 'unittest', 'discover', '-s', 'starter-kit/tests', '-p', 'test_standard_release.py', '-v'], check=True, env=check_env)
          subprocess.run(['git', 'diff', '--check'], check=True, env=check_env)
          require(set(git('diff', '--name-only').splitlines()) == set(changes) - {'docs/releases/11.1.0.md'}, 'Unexpected tracked edits')
          require(api('/git/ref/heads/' + BRANCH)['object']['sha'] == TARGET, 'Branch moved before preparation commit')
          tree = api('/git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}').strip(), 'tree': [{'path': name, 'mode': '100644', 'type': 'blob', 'content': content} for name, content in changes.items()]})
          commit = api('/git/commits', {'message': 'release: finalize 11.1.0 metadata and adoption guidance\n\nOwner-authorized release preparation only; preserve requirements and historical releases. Real-agent evaluation remains owner-run and outside this release gate.', 'tree': tree['sha'], 'parents': [TARGET]})
          api('/git/refs/heads/' + BRANCH, {'sha': commit['sha'], 'force': False}, 'PATCH')
          print('Prepared branch commit:', commit['sha'])
          print('No tag or release published; connector review/PR/CI/merge remain required.')
          PY
