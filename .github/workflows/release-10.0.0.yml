name: Publish standard 10.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-10.0.0.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-standard-10.0.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ios3kov/AE-Development-Rules' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout immutable publication source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish exact main after both CI workflows pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, io, json, os, subprocess, tarfile, tempfile, time, urllib.request, urllib.error, urllib.parse, zipfile
          from pathlib import Path
          repo = 'ios3kov/AE-Development-Rules'
          target = os.environ['GITHUB_SHA']
          tag = 'v10.0.0'
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def api(path, data=None, method=None):
              request = urllib.request.Request(base + path, headers=headers, data=None if data is None else json.dumps(data).encode(), method=method or ('GET' if data is None else 'POST'))
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and data is None:
                      return None
                  raise RuntimeError('GitHub API failed with HTTP ' + str(error.code)) from None

          def git(*args):
              return subprocess.check_output(['git', *args])

          def verified_jobs(jobs, required):
              selected = {job['name']: job for job in jobs if job.get('name') in required}
              require(sum(job.get('name') in required for job in jobs) == len(required) and len(selected) == len(required) and all(j['status'] == 'completed' and j['conclusion'] == 'success' for j in selected.values()), 'Required exact-main jobs did not all pass')

          def verify_archive(data, kind, expected, prefix):
              actual = {}
              if kind == 'zip':
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      for entry in archive.infolist():
                          if entry.is_dir():
                              continue
                          require(entry.filename.startswith(prefix), 'Archive prefix mismatch')
                          name = entry.filename[len(prefix):]
                          require(name not in actual and name in expected, 'Unexpected/duplicate archive file')
                          mode = (entry.external_attr >> 16) & 0o777
                          # Git marks ordinary non-executable ZIP entries with mode 0.
                          actual[name] = (archive.read(entry), mode or 0o644)
              else:
                  with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                      for entry in archive:
                          if entry.isdir():
                              continue
                          require(entry.isfile() and entry.name.startswith(prefix), 'Unexpected archive type/path')
                          name = entry.name[len(prefix):]
                          require(name not in actual and name in expected, 'Unexpected/duplicate archive file')
                          actual[name] = (archive.extractfile(entry).read(), entry.mode & 0o777)
              require(actual == expected, 'Archive bytes/file modes do not match exact Git tree')

          def tag_commit(ref):
              obj = ref['object']
              if obj['type'] == 'tag':
                  obj = api('/git/tags/' + obj['sha'])['object']
              require(obj['type'] == 'commit', 'Release tag is not a commit')
              return obj['sha']

          require(git('rev-parse', 'HEAD').decode().strip() == target, 'Checkout identity mismatch')
          require(Path('VERSION').read_text().strip() == '10.0.0', 'Release version mismatch')
          required = {'Starter Kit Self Test': {'self-test (ubuntu-latest)', 'self-test (macos-latest)', 'self-test (windows-latest)'}, 'Reference Obligation Validator': {'reference-obligation-tests'}}
          ci = {}
          for _ in range(90):
              runs = api('/actions/runs?' + urllib.parse.urlencode({'head_sha': target, 'event': 'push', 'per_page': 100}))['workflow_runs']
              for name, names in required.items():
                  matches = [r for r in runs if r.get('name') == name and r.get('head_sha') == target]
                  if matches:
                      run = max(matches, key=lambda r: r['id'])
                      if run['status'] == 'completed':
                          require(run['conclusion'] == 'success', 'Exact-main CI failed: ' + name)
                          jobs = api('/actions/runs/' + str(run['id']) + '/jobs?per_page=100')['jobs']
                          verified_jobs(jobs, names)
                          ci[name] = {'run_id': run['id'], 'url': run['html_url'], 'head_sha': target, 'conclusion': 'success', 'jobs': [{'name': j['name'], 'id': j['id'], 'conclusion': j['conclusion']} for j in jobs if j['name'] in names]}
              if set(ci) == set(required):
                  break
              time.sleep(10)
          require(set(ci) == set(required), 'Timed out waiting for exact-main CI')
          require(api('/branches/main')['commit']['sha'] == target, 'Main moved before publication')

          prefix = 'AE-Development-Rules-10.0.0/'
          expected = {}
          for item in git('ls-tree', '-rz', target).split(b'\0'):
              if not item:
                  continue
              meta, name = item.split(b'\t', 1)
              mode, kind, sha = meta.decode().split()
              require(kind == 'blob' and mode in ('100644', '100755'), 'Source-only release rejects special files/submodules')
              expected[name.decode()] = (git('cat-file', 'blob', sha), int(mode, 8) & 0o777)
          assets = {'AE-Development-Rules-10.0.0.zip': git('archive', '--format=zip', '--prefix=' + prefix, target), 'AE-Development-Rules-10.0.0.tar.gz': gzip.compress(git('-c', 'tar.umask=0022', 'archive', '--format=tar', '--prefix=' + prefix, target), mtime=0)}
          verify_archive(assets['AE-Development-Rules-10.0.0.zip'], 'zip', expected, prefix)
          verify_archive(assets['AE-Development-Rules-10.0.0.tar.gz'], 'tar.gz', expected, prefix)
          evidence = {'schema_version': 1, 'standard_version': '10.0.0', 'tag': tag, 'commit': target, 'git_tree': git('rev-parse', target + '^{tree}').decode().strip(), 'scope': 'source-standard-and-offline-tool-contracts', 'ci': ci, 'archive_tree_bytes_and_file_modes': 'PASS', 'archives': {name: {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)} for name, data in assets.items()}, 'live_agent': 'NOT_RUN', 'AE_iPhone_runtime': 'NOT_RUN', 'operational_policy_reviewer_protection': 'BLOCKED', 'windows_python_platform_skips': 7, 'limits': 'No host/agent effectiveness or general security certification. Broker observation does not audit every denied syscall; operational protections are unchanged.'}
          assets['release-evidence.json'] = (json.dumps(evidence, indent=2, sort_keys=True) + '\n').encode()
          assets['SHA256SUMS.txt'] = ''.join(hashlib.sha256(data).hexdigest() + '  ' + name + '\n' for name, data in sorted(assets.items())).encode()

          ref = api('/git/ref/tags/' + tag)
          if ref:
              require(tag_commit(ref) == target, 'Existing tag points elsewhere; never replace it')
          else:
              annotated = api('/git/tags', {'tag': tag, 'message': 'AE Development Rules 10.0.0', 'object': target, 'type': 'commit'})
              api('/git/refs', {'ref': 'refs/tags/' + tag, 'sha': annotated['sha']})
          body = Path('docs/releases/10.0.0.md').read_text().replace('Major process release candidate. Publication is confirmed', 'Major process release. Publication is confirmed')
          body = body.replace('](../../', '](https://github.com/' + repo + '/blob/' + tag + '/').replace('](../', '](https://github.com/' + repo + '/blob/' + tag + '/docs/')
          body += '\n\nExact release commit: `' + target + '`\n\n' + '\n'.join(name + ': ' + run['url'] for name, run in ci.items()) + '\n\nSource archives, checksums and exact-commit CI Evidence attached. Start with [AI_ENTRYPOINT.md](https://github.com/' + repo + '/blob/' + tag + '/AI_ENTRYPOINT.md) and [migration/tool instructions](https://github.com/' + repo + '/blob/' + tag + '/docs/releases/10.0.0.md).\n'
          release = api('/releases/tags/' + tag)
          if release is None:
              release = api('/releases', {'tag_name': tag, 'target_commitish': target, 'name': 'AE Development Rules 10.0.0', 'body': body, 'draft': True, 'prerelease': False})
          require(release['tag_name'] == tag and not release['prerelease'], 'Unexpected existing release')
          listed = api('/releases/' + str(release['id']) + '/assets?per_page=100')
          require(len({a['name'] for a in listed}) == len(listed) and all(a['name'] in assets for a in listed), 'Unknown/duplicate existing assets; preserve and stop')
          for name, data in assets.items():
              existing = next((a for a in listed if a['name'] == name), None)
              if existing is None:
                  require(release['draft'], 'Published release is missing assets; do not mutate it')
                  url = 'https://uploads.github.com/repos/' + repo + '/releases/' + str(release['id']) + '/assets?' + urllib.parse.urlencode({'name': name})
                  request = urllib.request.Request(url, headers={**headers, 'Content-Type': 'application/octet-stream'}, data=data, method='POST')
                  with urllib.request.urlopen(request, timeout=60) as response:
                      existing = json.load(response)
              require(existing['state'] == 'uploaded' and existing['size'] == len(data) and existing.get('digest') == 'sha256:' + hashlib.sha256(data).hexdigest(), 'Uploaded asset digest/size mismatch')
          require(api('/branches/main')['commit']['sha'] == target and tag_commit(api('/git/ref/tags/' + tag)) == target, 'Publication identity moved')
          if release['draft']:
              release = api('/releases/' + str(release['id']), {'draft': False, 'make_latest': 'true'}, method='PATCH')
          require(not release['draft'] and not release['prerelease'], 'Release is not published stable')
          print(release['html_url'])
          print('released', tag, target)
          PY
