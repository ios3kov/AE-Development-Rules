name: Starter Kit Self Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Run standard self-test
        run: node starter-kit/scripts/self-test.mjs --dry-run
