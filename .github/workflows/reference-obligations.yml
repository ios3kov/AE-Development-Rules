name: Reference Obligation Validator
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-obligation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run reference obligation negative tests
        run: python3 -m unittest discover -s starter-kit/tests -p 'test_reference_*.py' -v
