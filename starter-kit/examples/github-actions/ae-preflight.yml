name: AE Preflight

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Make preflight executable
        run: chmod +x starter-kit/scripts/preflight.sh

      - name: Run project preflight
        env:
          AE_PREFLIGHT_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        run: starter-kit/scripts/preflight.sh

      - name: Reminder
        run: |
          echo "CI preflight is not a substitute for required runtime After Effects tests."
          echo "Keep AE-only checks as separate VERIFIED/BLOCKED/NOT RUN evidence."
