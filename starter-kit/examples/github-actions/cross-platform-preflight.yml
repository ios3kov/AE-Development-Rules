name: Cross-platform Preflight

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-preflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run macOS preflight
        env:
          AE_PREFLIGHT_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          chmod +x starter-kit/scripts/preflight.sh
          starter-kit/scripts/preflight.sh

  windows-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run Windows preflight
        env:
          AE_PREFLIGHT_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        shell: pwsh
        run: starter-kit/scripts/preflight.ps1

  note:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Static CI preflight does not replace runtime After Effects tests."
          echo "Record AE runtime compatibility separately per platform."
